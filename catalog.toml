# pzget catalog — your curated apps & webapps
#
# Structure:
#   [[categories]]
#   id    = "dev"                 stable internal id (no spaces)
#   name  = "Desarrollo"          (kept for organisation; menu groups by source)
#   icon  = "🛠️"
#   blurb = "editores, git…"
#
#     [[categories.apps]]
#     name    = "Neovim"          shown in the menu
#     source  = "repo"            repo | aur | webapp
#     pkg     = "neovim"          package name  (repo / aur)
#     url     = "https://..."     web address   (webapp)
#     desc    = "..."             description (default / fallback)
#     desc_en = "..."             English description (used when language = en)
#
# The menu shows desc_<lang> if present, else desc. (Language is chosen at
# install time and stored in ~/.config/pzget/lang.)

[[categories]]
id = "dev"
name = "Desarrollo"
icon = "🛠️"
blurb = "editores, git, terminales"

  [[categories.apps]]
  name = "Neovim"
  source = "repo"
  pkg = "neovim"
  desc = "editor de texto basado en Vim"
  desc_en = "Vim-based text editor"

  [[categories.apps]]
  name = "Visual Studio Code"
  source = "aur"
  pkg = "visual-studio-code-bin"
  desc = "editor de código de Microsoft"
  desc_en = "Microsoft's code editor"

  [[categories.apps]]
  name = "Zed"
  source = "repo"
  pkg = "zed"
  desc = "editor de código rápido y colaborativo"
  desc_en = "fast, collaborative code editor"

  [[categories.apps]]
  name = "lazygit"
  source = "repo"
  pkg = "lazygit"
  desc = "interfaz de terminal para git"
  desc_en = "terminal UI for git"

