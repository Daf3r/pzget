# pzget catalog — your curated apps & webapps
#
# Structure:
#   [[categories]]
#   id    = "dev"                 stable internal id (no spaces)
#   name  = "Desarrollo"          shown in the menu
#   icon  = "🛠️"                  emoji shown before the name
#   blurb = "editores, git…"      short hint shown next to the category
#
#     [[categories.apps]]
#     name   = "Neovim"           shown in the menu
#     source = "repo"             repo | aur | webapp
#     pkg    = "neovim"           package name  (for source = repo | aur)
#     url    = "https://..."      web address   (for source = webapp)
#     desc   = "..."              short one-line description (optional)
#
# User-added webapps live in ~/.config/pzget/webapps.toml and are merged
# automatically as a "Mis webapps" category — you don't edit those here.

[[categories]]
id = "dev"
name = "Desarrollo"
icon = "🛠️"
blurb = "editores, git, terminales"

  [[categories.apps]]
  name = "Neovim"
  source = "repo"
  pkg = "neovim"
  desc = "editor de texto basado en Vim"

  [[categories.apps]]
  name = "Visual Studio Code"
  source = "aur"
  pkg = "visual-studio-code-bin"
  desc = "editor de código de Microsoft"

  [[categories.apps]]
  name = "Zed"
  source = "repo"
  pkg = "zed"
  desc = "editor de código rápido y colaborativo"

  [[categories.apps]]
  name = "lazygit"
  source = "repo"
  pkg = "lazygit"
  desc = "interfaz de terminal para git"

[[categories]]
id = "media"
name = "Multimedia"
icon = "🎵"
blurb = "música, vídeo, fotos"

  [[categories.apps]]
  name = "mpv"
  source = "repo"
  pkg = "mpv"
  desc = "reproductor de vídeo minimalista"

  [[categories.apps]]
  name = "Spotify"
  source = "aur"
  pkg = "spotify"
  desc = "música en streaming"

[[categories]]
id = "gaming"
name = "Juegos"
icon = "🎮"
blurb = "Steam, Lutris…"

  [[categories.apps]]
  name = "Steam"
  source = "repo"
  pkg = "steam"
  desc = "tienda y lanzador de juegos de Valve"

  [[categories.apps]]
  name = "Lutris"
  source = "repo"
  pkg = "lutris"
  desc = "plataforma de juegos para Linux"

[[categories]]
id = "web"
name = "Apps web"
icon = "🌐"
blurb = "YouTube, ChatGPT…"

  [[categories.apps]]
  name = "YouTube"
  source = "webapp"
  url = "https://youtube.com"
  desc = "vídeos"

  [[categories.apps]]
  name = "ChatGPT"
  source = "webapp"
  url = "https://chatgpt.com"
  desc = "asistente de OpenAI"
